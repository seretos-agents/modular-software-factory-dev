name: notify-consumers-test

# Tests for the shared notify-consumers action. Every lib's release pipeline
# depends on it, so a change to it is verified before it reaches main.
on:
  pull_request:
    paths:
      - ".github/actions/notify-consumers/**"
      - ".github/workflows/notify-consumers-test.yml"
  push:
    branches: [main]
    paths:
      - ".github/actions/notify-consumers/**"
      - ".github/workflows/notify-consumers-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .github/actions/notify-consumers

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest
